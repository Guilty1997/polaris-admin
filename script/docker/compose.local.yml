name: polaris-local

services:
  mysql:
    image: mysql:8.0.33
    container_name: polaris-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: polaris_admin
      MYSQL_USER: polaris_admin
      MYSQL_PASSWORD: polaris_admin
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --lower_case_table_names=1
    ports:
      - "3306:3306"
    volumes:
      - polaris_mysql_data:/var/lib/mysql
      - ../sql:/opt/polaris-sql:ro
      - ../sql/compose-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6.2
    container_name: polaris-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - polaris_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: polaris-minio
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: polaris
      MINIO_ROOT_PASSWORD: polaris123
    command: server --address ":9000" --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - polaris_minio_data:/data
      - polaris_minio_config:/root/.minio

volumes:
  polaris_mysql_data:
  polaris_redis_data:
  polaris_minio_data:
  polaris_minio_config:

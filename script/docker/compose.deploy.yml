name: polaris-deploy

services:
  mysql:
    image: mysql:8.4
    container_name: polaris-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: polaris_admin
      MYSQL_USER: polaris_admin
      MYSQL_PASSWORD: polaris_admin
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --lower_case_table_names=1
    ports:
      - "3306:3306"
    volumes:
      - ./volumes/mysql/data:/var/lib/mysql

  polaris-server:
    build:
      context: ../../polaris-server
      dockerfile: Dockerfile
    image: polaris/polaris-server:local
    container_name: polaris-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: polaris_admin
      DB_USER: polaris_admin
      DB_PASSWORD: polaris_admin
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
      REDIS_DB: 0
      SNAIL_SERVER_HOST: 127.0.0.1
      SNAIL_SERVER_PORT: 17888
    ports:
      - "8080:8080"
    depends_on:
      - mysql
